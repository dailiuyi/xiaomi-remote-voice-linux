<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MI 语音预览</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#17191c;color:#eceef1}*{box-sizing:border-box}body{margin:0;padding:30px 24px;max-width:850px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:23px;font-weight:550;margin:0}.tag{font-size:12px;color:#aeb5c0;border:1px solid #3a3e45;border-radius:20px;padding:6px 10px}p{line-height:1.65;color:#adb4bf;font-size:14px}section{margin-top:26px}.label{font-size:12px;color:#939ca9;margin-bottom:12px;letter-spacing:.04em}.text{border:1px solid #353a43;border-radius:12px;padding:20px;min-height:150px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;background:#1d2025}.empty{color:#697484}#phase{color:#b9d4ed}textarea{font:inherit;line-height:1.6;color:inherit;background:#1d2025;border:1px solid #3d4450;border-radius:10px;width:100%;min-height:135px;padding:16px;resize:vertical}textarea:focus{outline:2px solid #a0bad5;outline-offset:2px}#metrics{font-size:12px;min-height:18px}.error{color:#f0b0a7}
@media(prefers-color-scheme:light){:root{background:#f7f8fa;color:#20242a}.text,textarea{background:white;border-color:#d7dce3}p,.label{color:#66717f}#phase{color:#315d87}.tag{border-color:#d7dce3;color:#66717f}}
</style>
<header><h1>MI 语音输入</h1><span class="tag">本地 · Qwen 1.7B</span></header>
<p>按住说话时查看预览，松开后生成最终文字。最终文字会粘贴到当前获得焦点的输入框。</p>
<section><div class="label" id="phase" role="status">连接预览服务…</div><div class="text empty" id="text" aria-live="polite">等待语音</div><p id="metrics"></p></section>
<section><div class="label">输入验收</div><textarea id="target" placeholder="点击这里，再按住遥控器语音键；也可以点击其他编辑器的输入框。" aria-label="MI 语音输入验收"></textarea><p>预览会修正，仅最终文字写入一次。程序不自动发送或按回车。</p></section>
<script>
const phase=document.querySelector('#phase'),text=document.querySelector('#text'),metrics=document.querySelector('#metrics');
let alive=true;const history=[];window.previewHistory=history;
async function poll(){try{const r=await fetch('status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();phase.textContent=s.message;phase.classList.toggle('error',s.phase==='failed');const shown=s.phase==='recording'||s.phase==='tail'||s.phase==='finalizing'?s.preview:s.final; text.textContent=shown||'等待语音';text.classList.toggle('empty',!shown);const a=[];if(s.first_preview_seconds!=null)a.push('首次预览 '+s.first_preview_seconds.toFixed(2)+' 秒');if(s.metrics?.transcription_seconds!=null)a.push('最终转写 '+s.metrics.transcription_seconds.toFixed(2)+' 秒');metrics.textContent=a.join(' · ');const inputValue=document.querySelector('#target').value;if(!history.length||JSON.stringify(history.at(-1).state)!==JSON.stringify(s)||history.at(-1).inputValue!==inputValue){history.push({at:performance.now(),state:s,inputValue,focusedElement:document.activeElement.id});if(history.length>300)history.shift();}}catch(e){phase.textContent='预览服务未连接，请检查启动终端';}if(alive)setTimeout(poll,150)}poll();addEventListener('pagehide',()=>alive=false);
</script></html>

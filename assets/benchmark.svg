<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="bmTitle bmDesc">
  <title id="bmTitle">Qwen3-ASR vs Whisper Medium Benchmark Card</title>
  <desc id="bmDesc">Comparison between Qwen3-ASR 1.7B (current primary) and Whisper medium (legacy fallback) on RTX 4060 Laptop GPU with Xiaomi RC003-MS remote audio.</desc>

  <defs>
    <linearGradient id="bmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="qwenCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f33"/>
      <stop offset="100%" stop-color="#0e1624"/>
    </linearGradient>
    <linearGradient id="whisperCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191e2b"/>
      <stop offset="100%" stop-color="#11151e"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="20" fill="url(#bmBg)"/>
  <rect width="1198" height="378" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Benchmark Header -->
  <g transform="translate(56, 36)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">本地 ASR 模型实测对比</text>
    <text x="215" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">OFFLINE MODEL BENCHMARK · RTX 4060 (8GB)</text>
  </g>

  <!-- Card 1: Qwen3-ASR 1.7B (Recommended Primary) -->
  <g transform="translate(56, 68)">
    <rect width="524" height="254" rx="14" fill="url(#qwenCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardGlow)"/>

    <!-- Badge -->
    <g transform="translate(24, 20)">
      <rect width="168" height="24" rx="6" fill="#0369a1"/>
      <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
      <text x="24" y="16" fill="#f0f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CURRENT PRIMARY</text>
    </g>

    <!-- Model Name -->
    <text x="24" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Qwen3-ASR 1.7B</text>
    <text x="24" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Transformers BF16 / SDPA · 本地 CUDA 推理</text>

    <!-- Metrics Matrix -->
    <g transform="translate(24, 116)">
      <!-- Row 1: Latency -->
      <g transform="translate(0, 0)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">单句转写耗时</text>
        <text x="110" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">0.32s ~ 0.72s</text>
        <text x="220" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（音频 5.4s ~ 8.0s）</text>
      </g>
      <!-- Row 2: VRAM -->
      <g transform="translate(0, 28)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">显存占用</text>
        <text x="110" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">~4.4 GB</text>
        <text x="220" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（Allocated 4480 MiB）</text>
      </g>
      <!-- Row 3: UI Support -->
      <g transform="translate(0, 56)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">悬浮预览</text>
        <text x="110" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">原生支持增量重识别快照</text>
        <text x="280" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（每秒更新波形与字词）</text>
      </g>
      <!-- Row 4: Quality -->
      <g transform="translate(0, 84)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">中英混输/术语</text>
        <text x="110" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">极高断句准度，开发术语与标点自然</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Whisper medium (Legacy Fallback) -->
  <g transform="translate(620, 68)">
    <rect width="524" height="254" rx="14" fill="url(#whisperCardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Badge -->
    <g transform="translate(24, 20)">
      <rect width="144" height="24" rx="6" fill="#334155"/>
      <circle cx="12" cy="12" r="4" fill="#94a3b8"/>
      <text x="24" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">LEGACY FALLBACK</text>
    </g>

    <!-- Model Name -->
    <text x="24" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Whisper Medium</text>
    <text x="24" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">faster-whisper / CTranslate2 int8_float16</text>

    <!-- Metrics Matrix -->
    <g transform="translate(24, 116)">
      <!-- Row 1: Latency -->
      <g transform="translate(0, 0)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">单句转写耗时</text>
        <text x="110" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">~0.87s</text>
        <text x="200" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（音频 5.45s，beam=5）</text>
      </g>
      <!-- Row 2: VRAM -->
      <g transform="translate(0, 28)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">显存占用</text>
        <text x="110" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">~1.5 ~ 2.1 GB</text>
        <text x="220" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（轻量显卡友好）</text>
      </g>
      <!-- Row 3: UI Support -->
      <g transform="translate(0, 56)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">悬浮预览</text>
        <text x="110" y="16" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">不支持实时增量预览</text>
        <text x="250" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">（松开后一次性转写）</text>
      </g>
      <!-- Row 4: Quality -->
      <g transform="translate(0, 84)">
        <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">中英混输/术语</text>
        <text x="110" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">偶发同音字小幻觉（如“当前”误识为“浪天”）</text>
      </g>
    </g>
  </g>

  <!-- Footnote -->
  <text x="56" y="352" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    * 测试环境：Ubuntu 26.04 LTS，RTX 4060 Laptop 8GB；测试样本来自小米 RC003-MS 遥控器真实录音；两套方案均离线本地运行。
  </text>
</svg>

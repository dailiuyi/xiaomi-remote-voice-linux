<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Xiaomi Voice Input System Architecture</title>
  <desc id="archDesc">End-to-end architecture from Xiaomi Bluetooth Remote RC003-MS to Linux active window via Rust ATVV receiver, PipeWire, real-time DSP, local Qwen ASR, and desktop injector.</desc>

  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e2e"/>
      <stop offset="100%" stop-color="#0e1622"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192038"/>
      <stop offset="100%" stop-color="#101526"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241a38"/>
      <stop offset="100%" stop-color="#150f24"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142621"/>
      <stop offset="100%" stop-color="#0b1714"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="460" rx="20" fill="url(#archBg)"/>
  <rect width="1198" height="458" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Architecture Header -->
  <g transform="translate(56, 36)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">系统数据流与工作架构</text>
    <text x="210" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">SYSTEM PIPELINE &amp; ARCHITECTURE</text>
  </g>

  <!-- 4 Main Pipeline Columns -->

  <!-- Column 1: Hardware & Bluetooth -->
  <g transform="translate(56, 76)">
    <rect width="240" height="340" rx="14" fill="url(#cyanCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="240" height="36" rx="14" fill="#1a2538"/>
    <text x="20" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. 硬件与蓝牙层</text>

    <!-- Node 1: Remote -->
    <g transform="translate(18, 56)">
      <rect width="204" height="74" rx="10" fill="#0c121d" stroke="#334155" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">小米蓝牙遥控器</text>
      <text x="14" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">型号 RC003-MS (ATVV v1.0)</text>
      <circle cx="188" cy="24" r="5" fill="#10b981"/>
    </g>

    <!-- Down Arrow -->
    <path d="M 120 130 L 120 156" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="128" y="148" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">BLE GATT</text>

    <!-- Node 2: BlueZ -->
    <g transform="translate(18, 164)">
      <rect width="204" height="74" rx="10" fill="#0c121d" stroke="#334155" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Linux BlueZ 栈</text>
      <text x="14" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">D-Bus 蓝牙服务与特征值监听</text>
    </g>

    <g transform="translate(18, 258)">
      <rect width="204" height="60" rx="8" fill="#101927"/>
      <text x="12" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">传输载荷：</text>
      <text x="12" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">按键按下/松开 + ADPCM 压缩帧</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 296 200 L 336 200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 2: Receiver & Audio Bridge -->
  <g transform="translate(340, 76)">
    <rect width="240" height="340" rx="14" fill="url(#blueCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="240" height="36" rx="14" fill="#202a46"/>
    <text x="20" y="23" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. 接收与音频层</text>

    <!-- Node 3: Rust ATVVoice -->
    <g transform="translate(18, 56)">
      <rect width="204" height="74" rx="10" fill="#0f1524" stroke="#4338ca" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Rust 接收器 (atvvoice)</text>
      <text x="14" y="48" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">状态机握手 + ADPCM 解码</text>
    </g>

    <!-- Down Arrow -->
    <path d="M 120 130 L 120 156" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="128" y="148" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">16kHz PCM</text>

    <!-- Node 4: PipeWire Virtual Node -->
    <g transform="translate(18, 164)">
      <rect width="204" height="74" rx="10" fill="#0f1524" stroke="#4338ca" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PipeWire 专属节点</text>
      <text x="14" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">atvvoice-rc003dictation</text>
    </g>

    <g transform="translate(18, 258)">
      <rect width="204" height="60" rx="8" fill="#13192e"/>
      <text x="12" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">隔离特性：</text>
      <text x="12" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">不占用/不修改系统默认麦克风路由</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 580 200 L 620 200" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 3: Processing & Local Inference -->
  <g transform="translate(624, 76)">
    <rect width="240" height="340" rx="14" fill="url(#purpleCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="240" height="36" rx="14" fill="#2d1f46"/>
    <text x="20" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. 信号处理与本地推理</text>

    <!-- Node 5: DSP Filter -->
    <g transform="translate(18, 56)">
      <rect width="204" height="74" rx="10" fill="#140f21" stroke="#7e22ce" stroke-width="1"/>
      <text x="14" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Python 实时 DSP 滤波</text>
      <text x="14" y="44" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">80Hz 高通去直流 / STFT 降噪</text>
      <text x="14" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">中值跳变消除 · 软限幅</text>
    </g>

    <!-- Down Arrow -->
    <path d="M 120 130 L 120 156" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="128" y="148" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">高信噪比音频</text>

    <!-- Node 6: Qwen ASR -->
    <g transform="translate(18, 164)">
      <rect width="204" height="74" rx="10" fill="#140f21" stroke="#7e22ce" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Qwen3-ASR 1.7B</text>
      <text x="14" y="48" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">PyTorch / CUDA 本地推理</text>
    </g>

    <g transform="translate(18, 258)">
      <rect width="204" height="60" rx="8" fill="#1e1430"/>
      <text x="12" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">安全与隐私：</text>
      <text x="12" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">100% 离线推理，零外网流量</text>
    </g>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <path d="M 864 200 L 904 200" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 4: Desktop UI & Input Injection -->
  <g transform="translate(908, 76)">
    <rect width="236" height="340" rx="14" fill="url(#greenCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="236" height="36" rx="14" fill="#173128"/>
    <text x="20" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">4. 桌面交互与输入注入</text>

    <!-- Node 7: Dynamic Island Preview -->
    <g transform="translate(16, 56)">
      <rect width="204" height="74" rx="10" fill="#0b1714" stroke="#059669" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PyQt6 灵动岛悬浮窗</text>
      <text x="14" y="48" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">置顶波形 / 状态 / 焦点防抢占</text>
    </g>

    <!-- Down Arrow -->
    <path d="M 118 130 L 118 156" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="126" y="148" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">转写文本</text>

    <!-- Node 8: Text Injector -->
    <g transform="translate(16, 164)">
      <rect width="204" height="74" rx="10" fill="#0b1714" stroke="#059669" stroke-width="1"/>
      <text x="14" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Klipper + ydotool</text>
      <text x="14" y="48" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">写入剪贴板并模拟 Ctrl+V</text>
    </g>

    <!-- Output destination badge -->
    <g transform="translate(16, 258)">
      <rect width="204" height="60" rx="8" fill="#0f231c"/>
      <text x="12" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">目标接收窗口：</text>
      <text x="12" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">当前焦点输入框 (不自动回车)</text>
    </g>
  </g>
</svg>
